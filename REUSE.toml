# posed and materialled by Yutong Wan.  See human_generation.md for the pipeline.
# Both the upstream and the derivative authorship are recorded.  Covers the
# .blend files and the .json files recording their MB-Lab parameters.
[[annotations]]
path = "data/models/**"
SPDX-FileCopyrightText = ["Manuel Bastioni, MB-Lab contributors", "2026 Yutong Wan"]
