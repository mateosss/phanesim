version = 1

# Derivative works: bodies generated from the MB-Lab base meshes, then rigged,
# posed and materialled by Yutong Wan.  See human_generation.md for the pipeline.
# Both the upstream and the derivative authorship are recorded.  Covers the
# .blend files and the .json files recording their MB-Lab parameters.
[[annotations]]
path = "data/models/**"
SPDX-FileCopyrightText = ["Manuel Bastioni, MB-Lab contributors", "2026 Yutong Wan"]
SPDX-License-Identifier = "AGPL-3.0-only"

# model1 additionally embeds three third-party accessory meshes obtained from
# Sketchfab under CC-BY-4.0, which requires each creator to be credited.  The
# full attribution notices that must travel with any redistribution are in
# README.md under "Third-party assets".
[[annotations]]
path = "data/models/model1/model1.blend"
SPDX-FileCopyrightText = [
    "Manuel Bastioni, MB-Lab contributors",
    "2026 Yutong Wan",
    "Lizardsking (https://sketchfab.com/lizardsking) - \"543 - Ring\"",
    "carloshisserich (https://sketchfab.com/carloshisserich) - \"Seiko Watch\"",
    "Mikaeel Irani (https://sketchfab.com/mirani55) - \"Braided Loop Wristband\"",
]
SPDX-License-Identifier = "AGPL-3.0-only AND CC-BY-4.0"

[[annotations]]
path = "data/hdri/**"
SPDX-FileCopyrightText = "Sergej Majboroda"
SPDX-License-Identifier = "CC0-1.0"

# Covers every sequence directory, including the generated animation
# descriptions, so new sequences need no further annotation.
[[annotations]]
path = "data/sequences/**"
SPDX-FileCopyrightText = "2026 Yutong Wan"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = "src/phanesim/schemas/**"
SPDX-FileCopyrightText = "2026 Yutong Wan"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = ["main.blend", "pyrightconfig.json", "uv.lock"]
SPDX-FileCopyrightText = "2026 Yutong Wan"
SPDX-License-Identifier = "BSD-3-Clause"
